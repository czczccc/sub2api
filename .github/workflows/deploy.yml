name: Deploy to Tokyo VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 207.148.92.152
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/sub2api
            git pull origin main
            cd deploy
            docker compose up -d --build
